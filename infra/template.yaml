AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Plataforma de Donaciones Seguras, stage académico (design.md). Tablas DynamoDB, Cognito
  (Authorization Code + PKCE, grupos, scopes, MFA TOTP), HTTP API con JWT authorizer y
  funciones Lambda con un rol IAM por función. Todo en una sola Región (us-east-2) y
  eliminable con `sam delete`.

# Convención: las funciones intrínsecas se escriben en forma corta y escalar (!Ref, !GetAtt,
# !Sub con texto). test/template.test.ts depende de ello para analizar la plantilla.

Parameters:
  StageName:
    Type: String
    Default: academic
    AllowedValues: [academic, prod]
    Description: >-
      Stage de API Gateway. La simulación de pagos solo existe en `academic` (CA-06.1); con
      `prod` la plantilla no crea esa ruta ni su función.
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173
    Description: >-
      Orígenes del frontend admitidos por CORS (sin barra final): el local y la salida SpaUrl.
      En el primer despliegue la SpaUrl aún no existe; se añade después y se vuelve a desplegar.
  CallbackUrls:
    Type: CommaDelimitedList
    Default: http://localhost:5173/auth/callback,https://oauth.pstmn.io/v1/callback
    Description: URLs de retorno del login (SPA local y Postman). Deben coincidir exactamente.
  LogoutUrls:
    Type: CommaDelimitedList
    Default: http://localhost:5173/
    Description: URLs a las que Cognito puede volver tras cerrar sesión.
  AuthorizationEngine:
    Type: String
    Default: embedded
    AllowedValues: [embedded, verified-permissions]
    Description: >-
      Motor de autorización de HU-04, HU-07 y HU-08: `embedded` (módulo authz, MVP) o
      `verified-permissions` (políticas Cedar de policies/ en Amazon Verified Permissions,
      HU-12). El policy store se crea siempre; solo con `verified-permissions` las funciones
      tienen permiso para consultarlo.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14]
    Description: Retención de CloudWatch Logs; como máximo 14 días (CA-NF07.1).

Conditions:
  # La simulación de pagos (HU-06) solo se despliega en el stage académico (CA-06.1).
  IsAcademicStage:
    Fn::Equals: [{ Ref: StageName }, academic]
  # HU-12: las funciones consultan Verified Permissions solo con este motor.
  UseVerifiedPermissions:
    Fn::Equals: [{ Ref: AuthorizationEngine }, verified-permissions]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        STAGE: !Ref StageName

Resources:
  # ---------------------------------------------------------------------------------------
  # DynamoDB (design.md §5). On-demand: sin costo fijo cuando no hay tráfico.
  # Cifrado en reposo con la llave propiedad de AWS (sin costo adicional).
  # ---------------------------------------------------------------------------------------
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-createdAt
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  DonationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: donationId
          AttributeType: S
        - AttributeName: donorSub
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: donationId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: donorSub-createdAt
          KeySchema:
            - AttributeName: donorSub
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # PK `donorSub#createDonation#idempotencyKey`; los registros caducan a las 24 h (TTL).
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # PK `eventType`, SK `timestamp#eventId` para filtrar por tipo y fecha (HU-10).
  AuditEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventType
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: eventType
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # ---------------------------------------------------------------------------------------
  # Cognito (Policy Administrator, design.md §6.1). Plan Essentials: managed login y hasta
  # 10.000 usuarios activos al mes sin costo. Solo se pide el correo (CA-NF10.1).
  # ---------------------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UserPoolTier: ESSENTIALS
      DeletionProtection: INACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      # Las cuentas de prueba las crea el equipo: nadie se registra solo ni elige su grupo.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 3
      # TOTP con app autenticadora, nunca SMS (CA-11.1). A GESTOR y AUDITOR se les exige por
      # el procedimiento de alta (decisión D5).
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      # Sin TOTP, un GESTOR o AUDITOR no obtiene tokens (HU-11, T14). Ver PreTokenGenerationFunction.
      LambdaConfig:
        PreTokenGenerationConfig:
          LambdaArn: !GetAtt PreTokenGenerationFunction.Arn
          LambdaVersion: V1_0
      # Un cambio de correo no se aplica hasta verificar el nuevo (protege la cuenta).
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  DonanteGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: DONANTE
      Description: Crea y simula sus donaciones; consulta su propio historial.
      Precedence: 30

  GestorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: GESTOR
      Description: Crea y publica proyectos. Requiere MFA TOTP.
      Precedence: 10

  AuditorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: AUDITOR
      Description: Consulta eventos de auditoría. Requiere MFA TOTP.
      Precedence: 20

  # Scopes que exige cada ruta protegida en el JWT authorizer (design.md §4).
  ApiResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: api
      Name: donations-api
      Scopes:
        - ScopeName: projects.write
          ScopeDescription: Crear y publicar proyectos
        - ScopeName: donations.write
          ScopeDescription: Crear y simular donaciones propias
        - ScopeName: donations.read
          ScopeDescription: Consultar el historial propio
        - ScopeName: audit.read
          ScopeDescription: Consultar eventos de auditoría

  # Dominio de managed login: https://<prefijo>.auth.<región>.amazoncognito.com
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub ${AWS::StackName}-${AWS::AccountId}
      ManagedLoginVersion: 2

  # Cliente público de la SPA y de Postman: sin secreto, solo Authorization Code + PKCE.
  WebClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ApiResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub ${AWS::StackName}-spa
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes:
        - openid
        - email
        - api/projects.write
        - api/donations.write
        - api/donations.read
        - api/audit.read
      # Las URLs del parámetro (local y Postman) más las de la SPA publicada en CloudFront.
      CallbackURLs:
        Fn::Split:
          - ","
          - Fn::Join:
              - ","
              - - Fn::Join: [",", { Ref: CallbackUrls }]
                - !Sub https://${SpaDistribution.DomainName}/auth/callback
      LogoutURLs:
        Fn::Split:
          - ","
          - Fn::Join:
              - ","
              - - Fn::Join: [",", { Ref: LogoutUrls }]
                - !Sub https://${SpaDistribution.DomainName}/
      SupportedIdentityProviders: [COGNITO]
      # Sin flujos de contraseña directos: el login pasa siempre por managed login.
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      # Tokens de vida corta y refresh token revocable (AD-07, CA-03.3).
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 12
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: hours
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  # Cliente para el alta de MFA (`npm run setup:mfa`): sin OAuth, solo usuario y contraseña,
  # tokens de 5 minutos. Sus tokens no sirven para el API: el JWT authorizer solo acepta el
  # client_id de la SPA.
  MfaSetupClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub ${AWS::StackName}-mfa-setup
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 5
      IdTokenValidity: 5
      RefreshTokenValidity: 60
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: minutes
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  # Trigger pre token generation: bloquea los tokens de GESTOR y AUDITOR sin TOTP (HU-11).
  PreTokenGenerationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-pre-token-generation
      RetentionInDays: !Ref LogRetentionDays

  PreTokenGenerationRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Trigger de Cognito. Solo cognito-idp:AdminGetUser para leer los métodos MFA.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt PreTokenGenerationLogGroup.Arn
        # Comodín justificado (CA-NF03.2): el pool referencia a esta función como trigger, así
        # que el rol no puede referenciar el ARN del pool sin crear una dependencia circular.
        # Se limita a una sola acción de lectura, en esta cuenta y esta Región.
        - PolicyName: read-user-mfa-settings
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [cognito-idp:AdminGetUser]
                Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  PreTokenGenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-pre-token-generation
      Description: Trigger pre token generation de Cognito (HU-11, T14)
      CodeUri: ../backend/dist/identity
      Handler: handlers.preTokenGeneration
      Role: !GetAtt PreTokenGenerationRole.Arn
      LoggingConfig:
        LogGroup: !Ref PreTokenGenerationLogGroup

  # Solo este user pool puede invocar el trigger.
  PreTokenGenerationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PreTokenGenerationFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # Managed login (versión 2) necesita un estilo por app client; se usa el de Cognito.
  WebClientBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref WebClient
      UseCognitoProvidedValues: true

  # ---------------------------------------------------------------------------------------
  # HTTP API (PEP). Throttling por stage, CORS por lista y access logs sin IP ni tokens.
  # ---------------------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","time":"$context.requestTime","routeKey":"$context.routeKey","status":"$context.status","latencyMs":"$context.responseLatency","integrationError":"$context.integrationErrorMessage","authorizerError":"$context.authorizer.error"}'
      # JWT authorizer: firma, emisor, expiración y client_id del access token (CA-NF02.1).
      # Sin DefaultAuthorizer: las rutas públicas siguen abiertas y cada ruta protegida
      # declara el authorizer y sus AuthorizationScopes.
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref WebClient
      CorsConfiguration:
        # Solo `!Ref`: SAM convierte CorsConfiguration en `x-amazon-apigateway-cors` y no
        # transforma bien Fn::Split/Fn::Join aquí (el API conservaba solo localhost). La URL de
        # la SPA (salida SpaUrl) se añade al parámetro AllowedOrigins en samconfig.toml.
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        AllowHeaders: [authorization, content-type, idempotency-key]
        MaxAge: 600

  HttpApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-http-api
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------------------------------
  # Amazon Verified Permissions (HU-12, AD-08): Policy Engine externo con Cedar. El esquema y
  # las políticas son copia exacta de policies/ (test/template.test.ts lo comprueba). Sin
  # solicitudes no tiene costo.
  # ---------------------------------------------------------------------------------------
  PolicyStore:
    Type: AWS::VerifiedPermissions::PolicyStore
    Properties:
      Description: !Sub ${AWS::StackName} - autorización de proyectos y donaciones (HU-12)
      ValidationSettings:
        Mode: STRICT
      DeletionProtection:
        Mode: DISABLED
      Schema:
        CedarJson: '{"Donations":{"entityTypes":{"User":{"memberOfTypes":["Role"]},"Role":{},"Platform":{},"Project":{},"Donation":{"shape":{"type":"Record","attributes":{"owner":{"type":"Entity","name":"User","required":true}}}}},"actions":{"ListManagedProjects":{"appliesTo":{"principalTypes":["User"],"resourceTypes":["Platform"],"context":{"type":"Record","attributes":{"scopes":{"type":"Set","element":{"type":"String"},"required":true}}}}},"CreateProject":{"appliesTo":{"principalTypes":["User"],"resourceTypes":["Platform"],"context":{"type":"Record","attributes":{"scopes":{"type":"Set","element":{"type":"String"},"required":true}}}}},"UpdateProject":{"appliesTo":{"principalTypes":["User"],"resourceTypes":["Project"],"context":{"type":"Record","attributes":{"scopes":{"type":"Set","element":{"type":"String"},"required":true}}}}},"PublishProject":{"appliesTo":{"principalTypes":["User"],"resourceTypes":["Project"],"context":{"type":"Record","attributes":{"scopes":{"type":"Set","element":{"type":"String"},"required":true}}}}},"ReadOwnDonations":{"appliesTo":{"principalTypes":["User"],"resourceTypes":["Platform"],"context":{"type":"Record","attributes":{"scopes":{"type":"Set","element":{"type":"String"},"required":true}}}}},"ReadDonation":{"appliesTo":{"principalTypes":["User"],"resourceTypes":["Donation"],"context":{"type":"Record","attributes":{"scopes":{"type":"Set","element":{"type":"String"},"required":true}}}}}}}}'

  GestorGestionaProyectosPolicy:
    Type: AWS::VerifiedPermissions::Policy
    Properties:
      PolicyStoreId: !Ref PolicyStore
      Definition:
        Static:
          Description: gestor-gestiona-proyectos (HU-04, HU-08)
          Statement: |
            permit (
              principal in Donations::Role::"GESTOR",
              action in [
                Donations::Action::"ListManagedProjects",
                Donations::Action::"CreateProject",
                Donations::Action::"UpdateProject",
                Donations::Action::"PublishProject"
              ],
              resource
            )
            when { context.scopes.contains("api/projects.write") };

  DonanteConsultaHistorialPolicy:
    Type: AWS::VerifiedPermissions::Policy
    Properties:
      PolicyStoreId: !Ref PolicyStore
      Definition:
        Static:
          Description: donante-consulta-historial (HU-07, T12)
          Statement: |
            permit (
              principal in Donations::Role::"DONANTE",
              action == Donations::Action::"ReadOwnDonations",
              resource == Donations::Platform::"donations"
            )
            when { context.scopes.contains("api/donations.read") };

  DonanteLeeDonacionPropiaPolicy:
    Type: AWS::VerifiedPermissions::Policy
    Properties:
      PolicyStoreId: !Ref PolicyStore
      Definition:
        Static:
          Description: donante-lee-donacion-propia (HU-07, T09)
          Statement: |
            permit (
              principal in Donations::Role::"DONANTE",
              action == Donations::Action::"ReadDonation",
              resource
            )
            when { resource.owner == principal && context.scopes.contains("api/donations.read") };

  # ---------------------------------------------------------------------------------------
  # Funciones de proyectos (lectura pública). Cada una tiene su propio rol con una sola
  # acción de DynamoDB y permiso de escritura solo en su propio log group (CA-NF03.1).
  # No se usa AWSLambdaBasicExecutionRole porque concede logs sobre Resource "*".
  # ---------------------------------------------------------------------------------------
  ListProjectsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-list-projects
      RetentionInDays: !Ref LogRetentionDays

  ListProjectsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GET /v1/projects. Solo Query sobre el GSI status-createdAt de Projects.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ListProjectsLogGroup.Arn
        - PolicyName: query-published-projects
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource: !Sub ${ProjectsTable.Arn}/index/status-createdAt

  ListProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-list-projects
      Description: GET /v1/projects (HU-01)
      CodeUri: ../backend/dist/projects
      Handler: handlers.listProjects
      Role: !GetAtt ListProjectsRole.Arn
      LoggingConfig:
        LogGroup: !Ref ListProjectsLogGroup
      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
      Events:
        ListProjects:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/projects

  GetProjectLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-get-project
      RetentionInDays: !Ref LogRetentionDays

  GetProjectRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GET /v1/projects/{projectId}. Solo GetItem sobre Projects.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt GetProjectLogGroup.Arn
        - PolicyName: get-project
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !GetAtt ProjectsTable.Arn

  GetProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-get-project
      Description: GET /v1/projects/{projectId} (HU-02)
      CodeUri: ../backend/dist/projects
      Handler: handlers.getProject
      Role: !GetAtt GetProjectRole.Arn
      LoggingConfig:
        LogGroup: !Ref GetProjectLogGroup
      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
      Events:
        GetProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/projects/{projectId}

  GetProjectStatsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-get-project-stats
      RetentionInDays: !Ref LogRetentionDays

  GetProjectStatsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GET /v1/projects/{projectId}/stats. Solo GetItem sobre Projects.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt GetProjectStatsLogGroup.Arn
        - PolicyName: get-project
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !GetAtt ProjectsTable.Arn

  GetProjectStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-get-project-stats
      Description: GET /v1/projects/{projectId}/stats (HU-09)
      CodeUri: ../backend/dist/projects
      Handler: handlers.getProjectStats
      Role: !GetAtt GetProjectStatsRole.Arn
      LoggingConfig:
        LogGroup: !Ref GetProjectStatsLogGroup
      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
      Events:
        GetProjectStats:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/projects/{projectId}/stats

  # ---------------------------------------------------------------------------------------
  # Gestión de proyectos (HU-08, decisión D2). Solo GESTOR con api/projects.write; cada
  # función tiene una sola acción de DynamoDB.
  # ---------------------------------------------------------------------------------------
  ListManagedProjectsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-list-managed-projects
      RetentionInDays: !Ref LogRetentionDays

  ListManagedProjectsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GET /v1/manage/projects. Solo Query sobre el GSI status-createdAt de Projects.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ListManagedProjectsLogGroup.Arn
        - PolicyName: query-all-projects
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource: !Sub ${ProjectsTable.Arn}/index/status-createdAt
        # HU-12: consultar el policy store, solo con AuthorizationEngine=verified-permissions.
        - Fn::If:
            - UseVerifiedPermissions
            - PolicyName: is-authorized
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
