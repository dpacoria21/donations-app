AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Plataforma de Donaciones Seguras, stage académico (design.md). Tablas DynamoDB, Cognito
  (Authorization Code + PKCE, grupos, scopes, MFA TOTP), HTTP API con JWT authorizer y
  funciones Lambda con un rol IAM por función. Todo en una sola Región (us-east-2) y
  eliminable con `sam delete`.

# Convención: las funciones intrínsecas se escriben en forma corta y escalar (!Ref, !GetAtt,
# !Sub con texto). test/template.test.ts depende de ello para analizar la plantilla.

Parameters:
  StageName:
    Type: String
    Default: academic
    AllowedValues: [academic]
    Description: Stage de API Gateway. La simulación de pagos solo existe en `academic`.
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173
    Description: Orígenes del frontend admitidos por CORS (sin barra final).
  CallbackUrls:
    Type: CommaDelimitedList
    Default: http://localhost:5173/auth/callback,https://oauth.pstmn.io/v1/callback
    Description: URLs de retorno del login (SPA local y Postman). Deben coincidir exactamente.
  LogoutUrls:
    Type: CommaDelimitedList
    Default: http://localhost:5173/
    Description: URLs a las que Cognito puede volver tras cerrar sesión.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14]
    Description: Retención de CloudWatch Logs; como máximo 14 días (CA-NF07.1).

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        STAGE: !Ref StageName

Resources:
  # ---------------------------------------------------------------------------------------
  # DynamoDB (design.md §5). On-demand: sin costo fijo cuando no hay tráfico.
  # Cifrado en reposo con la llave propiedad de AWS (sin costo adicional).
  # ---------------------------------------------------------------------------------------
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-createdAt
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  DonationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: donationId
          AttributeType: S
        - AttributeName: donorSub
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: donationId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: donorSub-createdAt
          KeySchema:
            - AttributeName: donorSub
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # PK `donorSub#createDonation#idempotencyKey`; los registros caducan a las 24 h (TTL).
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # PK `eventType`, SK `timestamp#eventId` para filtrar por tipo y fecha (HU-10).
  AuditEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventType
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: eventType
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # ---------------------------------------------------------------------------------------
  # Cognito (Policy Administrator, design.md §6.1). Plan Essentials: managed login y hasta
  # 10.000 usuarios activos al mes sin costo. Solo se pide el correo (CA-NF10.1).
  # ---------------------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UserPoolTier: ESSENTIALS
      DeletionProtection: INACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      # Las cuentas de prueba las crea el equipo: nadie se registra solo ni elige su grupo.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 3
      # TOTP con app autenticadora, nunca SMS (CA-11.1). A GESTOR y AUDITOR se les exige por
      # el procedimiento de alta (decisión D5).
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  DonanteGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: DONANTE
      Description: Crea y simula sus donaciones; consulta su propio historial.
      Precedence: 30

  GestorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: GESTOR
      Description: Crea y publica proyectos. Requiere MFA TOTP.
      Precedence: 10

  AuditorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: AUDITOR
      Description: Consulta eventos de auditoría. Requiere MFA TOTP.
      Precedence: 20

  # Scopes que exige cada ruta protegida en el JWT authorizer (design.md §4).
  ApiResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: api
      Name: donations-api
      Scopes:
        - ScopeName: projects.write
          ScopeDescription: Crear y publicar proyectos
        - ScopeName: donations.write
          ScopeDescription: Crear y simular donaciones propias
        - ScopeName: donations.read
          ScopeDescription: Consultar el historial propio
        - ScopeName: audit.read
          ScopeDescription: Consultar eventos de auditoría

  # Dominio de managed login: https://<prefijo>.auth.<región>.amazoncognito.com
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub ${AWS::StackName}-${AWS::AccountId}
      ManagedLoginVersion: 2

  # Cliente público de la SPA y de Postman: sin secreto, solo Authorization Code + PKCE.
  WebClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ApiResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub ${AWS::StackName}-spa
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes:
        - openid
        - email
        - api/projects.write
        - api/donations.write
        - api/donations.read
        - api/audit.read
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      SupportedIdentityProviders: [COGNITO]
      # Sin flujos de contraseña directos: el login pasa siempre por managed login.
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      # Tokens de vida corta y refresh token revocable (AD-07, CA-03.3).
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 12
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: hours
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  # Managed login (versión 2) necesita un estilo por app client; se usa el de Cognito.
  WebClientBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref WebClient
      UseCognitoProvidedValues: true

  # ---------------------------------------------------------------------------------------
  # HTTP API (PEP). Throttling por stage, CORS por lista y access logs sin IP ni tokens.
  # ---------------------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","time":"$context.requestTime","routeKey":"$context.routeKey","status":"$context.status","latencyMs":"$context.responseLatency","integrationError":"$context.integrationErrorMessage","authorizerError":"$context.authorizer.error"}'
      # JWT authorizer: firma, emisor, expiración y client_id del access token (CA-NF02.1).
      # Sin DefaultAuthorizer: las rutas públicas siguen abiertas y cada ruta protegida
      # declara el authorizer y sus AuthorizationScopes.
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref WebClient
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        AllowHeaders: [authorization, content-type, idempotency-key]
        MaxAge: 600

  HttpApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-http-api
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------------------------------
  # Funciones de proyectos (lectura pública). Cada una tiene su propio rol con una sola
  # acción de DynamoDB y permiso de escritura solo en su propio log group (CA-NF03.1).
  # No se usa AWSLambdaBasicExecutionRole porque concede logs sobre Resource "*".
  # ---------------------------------------------------------------------------------------
  ListProjectsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-list-projects
      RetentionInDays: !Ref LogRetentionDays

  ListProjectsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GET /v1/projects. Solo Query sobre el GSI status-createdAt de Projects.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ListProjectsLogGroup.Arn
        - PolicyName: query-published-projects
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource: !Sub ${ProjectsTable.Arn}/index/status-createdAt

  ListProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-list-projects
      Description: GET /v1/projects (HU-01)
      CodeUri: ../backend/dist/projects
      Handler: handlers.listProjects
      Role: !GetAtt ListProjectsRole.Arn
      LoggingConfig:
        LogGroup: !Ref ListProjectsLogGroup
      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
      Events:
        ListProjects:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/projects

  GetProjectLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-get-project
      RetentionInDays: !Ref LogRetentionDays

  GetProjectRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GET /v1/projects/{projectId}. Solo GetItem sobre Projects.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt GetProjectLogGroup.Arn
        - PolicyName: get-project
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !GetAtt ProjectsTable.Arn

  GetProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-get-project
      Description: GET /v1/projects/{projectId} (HU-02)
      CodeUri: ../backend/dist/projects
      Handler: handlers.getProject
      Role: !GetAtt GetProjectRole.Arn
      LoggingConfig:
        LogGroup: !Ref GetProjectLogGroup
      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
      Events:
        GetProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/projects/{projectId}

  GetProjectStatsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-get-project-stats
      RetentionInDays: !Ref LogRetentionDays

  GetProjectStatsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GET /v1/projects/{projectId}/stats. Solo GetItem sobre Projects.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt GetProjectStatsLogGroup.Arn
        - PolicyName: get-project
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !GetAtt ProjectsTable.Arn

  GetProjectStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-get-project-stats
      Description: GET /v1/projects/{projectId}/stats (HU-09)
      CodeUri: ../backend/dist/projects
      Handler: handlers.getProjectStats
      Role: !GetAtt GetProjectStatsRole.Arn
      LoggingConfig:
        LogGroup: !Ref GetProjectStatsLogGroup
      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
      Events:
        GetProjectStats:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/projects/{projectId}/stats

  # ---------------------------------------------------------------------------------------
  # Gestión de proyectos (HU-08, decisión D2). Solo GESTOR con api/projects.write; cada
  # función tiene una sola acción de DynamoDB.
  # ---------------------------------------------------------------------------------------
  ListManagedProjectsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-list-managed-projects
      RetentionInDays: !Ref LogRetentionDays

  ListManagedProjectsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GET /v1/manage/projects. Solo Query sobre el GSI status-createdAt de Projects.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ListManagedProjectsLogGroup.Arn
        - PolicyName: query-all-projects
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource: !Sub ${ProjectsTable.Arn}/index/status-createdAt

  ListManagedProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-list-managed-projects
      Description: GET /v1/manage/projects (HU-08)
      CodeUri: ../backend/dist/projects
      Handler: handlers.listManagedProjects
      Role: !GetAtt ListManagedProjectsRole.Arn
      LoggingConfig:
        LogGroup: !Ref ListManagedProjectsLogGroup
      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
      Events:
        ListManagedProjects:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/manage/projects
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes: [api/projects.write]

  CreateProjectLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-create-project
      RetentionInDays: !Ref LogRetentionDays

  CreateProjectRole:
    Type: AWS::IAM::Role
    Properties:
      Description: POST /v1/projects. Solo PutItem sobre Projects.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt CreateProjectLogGroup.Arn
        - PolicyName: put-project
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt ProjectsTable.Arn

  CreateProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-create-project
      Description: POST /v1/projects (HU-08)
      CodeUri: ../backend/dist/projects
      Handler: handlers.createProject
      Role: !GetAtt CreateProjectRole.Arn
      LoggingConfig:
        LogGroup: !Ref CreateProjectLogGroup
      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
      Events:
        CreateProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/projects
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes: [api/projects.write]

  UpdateProjectLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-update-project
      RetentionInDays: !Ref LogRetentionDays

  UpdateProjectRole:
    Type: AWS::IAM::Role
    Properties:
      Description: PATCH /v1/projects/{projectId}. Solo UpdateItem sobre Projects.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt UpdateProjectLogGroup.Arn
        - PolicyName: update-project
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:UpdateItem]
                Resource: !GetAtt ProjectsTable.Arn

  UpdateProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-update-project
      Description: PATCH /v1/projects/{projectId} (HU-08, decisión D2)
      CodeUri: ../backend/dist/projects
      Handler: handlers.updateProject
      Role: !GetAtt UpdateProjectRole.Arn
      LoggingConfig:
        LogGroup: !Ref UpdateProjectLogGroup
      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
      Events:
        UpdateProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PATCH
            Path: /v1/projects/{projectId}
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes: [api/projects.write]

  PublishProjectLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-publish-project
      RetentionInDays: !Ref LogRetentionDays

  PublishProjectRole:
    Type: AWS::IAM::Role
    Properties:
      Description: PATCH /v1/projects/{projectId}/publish. Solo UpdateItem sobre Projects.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt PublishProjectLogGroup.Arn
        - PolicyName: publish-project
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:UpdateItem]
                Resource: !GetAtt ProjectsTable.Arn

  PublishProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-publish-project
      Description: PATCH /v1/projects/{projectId}/publish (HU-08)
      CodeUri: ../backend/dist/projects
      Handler: handlers.publishProject
      Role: !GetAtt PublishProjectRole.Arn
      LoggingConfig:
        LogGroup: !Ref PublishProjectLogGroup
      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
      Events:
        PublishProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PATCH
            Path: /v1/projects/{projectId}/publish
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes: [api/projects.write]

  # ---------------------------------------------------------------------------------------
  # Funciones de donaciones (rutas protegidas).
  # ---------------------------------------------------------------------------------------
  GetMyDonationsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-get-my-donations
      RetentionInDays: !Ref LogRetentionDays

  GetMyDonationsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GET /v1/donations/me. Solo Query sobre el GSI donorSub-createdAt de Donations.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt GetMyDonationsLogGroup.Arn
        - PolicyName: query-own-donations
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource: !Sub ${DonationsTable.Arn}/index/donorSub-createdAt

  GetMyDonationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-get-my-donations
      Description: GET /v1/donations/me (HU-07)
      CodeUri: ../backend/dist/donations
      Handler: handlers.getMyDonations
      Role: !GetAtt GetMyDonationsRole.Arn
      LoggingConfig:
        LogGroup: !Ref GetMyDonationsLogGroup
      Environment:
        Variables:
          DONATIONS_TABLE: !Ref DonationsTable
      Events:
        GetMyDonations:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/donations/me
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes: [api/donations.read]

Outputs:
  ApiUrl:
    Description: URL base del API (baseUrl del entorno de Postman y VITE_API_BASE_URL).
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  UserPoolId:
    Description: COGNITO_USER_POOL_ID del backend.
    Value: !Ref UserPool
  UserPoolClientId:
    Description: COGNITO_CLIENT_ID del backend y VITE_COGNITO_CLIENT_ID del frontend.
    Value: !Ref WebClient
  CognitoIssuer:
    Description: VITE_COGNITO_AUTHORITY del frontend (emisor OIDC).
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  CognitoDomain:
    Description: VITE_COGNITO_DOMAIN del frontend (managed login, /oauth2/revoke y /logout).
    Value: !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  ProjectsTableName:
    Description: Valor de PROJECTS_TABLE para `npm run seed:projects`.
    Value: !Ref ProjectsTable
  DonationsTableName:
    Value: !Ref DonationsTable
  IdempotencyTableName:
    Value: !Ref IdempotencyTable
  AuditEventsTableName:
    Value: !Ref AuditEventsTable
