      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-create-project
      RetentionInDays: !Ref LogRetentionDays

  CreateProjectRole:
    Type: AWS::IAM::Role
    Properties:
      Description: POST /v1/projects. Solo PutItem sobre Projects.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt CreateProjectLogGroup.Arn
        - PolicyName: put-project
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt ProjectsTable.Arn
        # El evento de auditoría va en la misma transacción (TransactWriteItems) que el cambio.
        - PolicyName: write-audit-events
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt AuditEventsTable.Arn
        # HU-12: consultar el policy store, solo con AuthorizationEngine=verified-permissions.
        - Fn::If:
            - UseVerifiedPermissions
            - PolicyName: is-authorized
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Action: [verifiedpermissions:IsAuthorized]
                    Resource: !GetAtt PolicyStore.Arn
            - !Ref AWS::NoValue

