openapi: 3.1.0
info:
  title: Plataforma de Donaciones Seguras — API
  version: 0.1.0
  summary: API de donaciones simuladas de la Fundación AQP-SOLIDARIA (prototipo académico).
  description: |
    Contrato del API descrito en design.md §4. Las donaciones son **simuladas**: el API no
    solicita ni almacena datos de pago (CA-05.5).

    - Montos en céntimos enteros de PEN (`*AmountCents`); nunca `float` (AD-04).
    - Los errores de los handlers usan el formato uniforme `Error` (`{ code, message, requestId }`)
      sin detalles internos. Los rechazos que emite API Gateway antes de llegar a Lambda (por
      ejemplo, el 401 del JWT authorizer) usan el formato nativo de HTTP API.
    - Las rutas protegidas exigen un **access token** de Cognito (`Authorization: Bearer`)
      obtenido con Authorization Code + PKCE, y al menos uno de los scopes de la ruta
      (CA-NF02.1). Además, la Lambda comprueba el grupo (`cognito:groups`) y el propietario.
    - Un ID token pasa la firma pero no tiene scopes: API Gateway responde 403 (decisión D4
      de tasks.md).

    Este archivo se amplía en cada fase (tasks.md). La prueba `backend/test/openapi.test.ts`
    comprueba que cada ruta implementada esté documentada aquí.
  license:
    name: Uso académico
    identifier: CC-BY-4.0
servers:
  - url: http://127.0.0.1:3000
    description: API local de desarrollo (backend, npm run dev)
  - url: https://{apiId}.execute-api.us-east-2.amazonaws.com/academic
    description: Stage académico en API Gateway HTTP API (fase 2)
    variables:
      apiId:
        default: pendiente
        description: Identificador de la HTTP API tras `sam deploy`.
tags:
  - name: Proyectos
    description: Catálogo público de proyectos sociales (EP-01, EP-04).
  - name: Gestión
    description: Creación, edición y publicación de proyectos por el GESTOR (HU-08).
  - name: Auditoría
    description: Consulta de eventos de auditoría (HU-10, extensión). Solo AUDITOR con MFA.
  - name: Donaciones
    description: Donaciones simuladas del donante autenticado (EP-03).
paths:
  /v1/projects:
    get:
      tags: [Proyectos]
      operationId: listProjects
      summary: Listar proyectos publicados
      description: |
        Solo devuelve proyectos `PUBLICADO`, del más reciente al más antiguo. Si no hay
        ninguno, `items` es una lista vacía (HU-01: CA-01.1, CA-01.2, CA-01.3; T01).
      security: []
      responses:
        "200":
          description: Catálogo público.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
              example:
                items:
                  - projectId: 7a91d0c4-2e5f-4b38-a6c7-1d9e8f2b4a63
                    title: Comedor popular de Alto Selva Alegre
                    description: Raciones diarias de almuerzo para familias del comedor comunitario.
                    goalAmountCents: 800000
                    confirmedAmountCents: 612550
                    currency: PEN
                    status: PUBLICADO
                    updatedAt: "2026-11-09T18:45:00.000Z"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Gestión]
      operationId: createProject
      summary: Crear un proyecto en BORRADOR
      description: |
        Solo GESTOR. El proyecto nace en BORRADOR con 0 recaudado y no aparece en el catálogo
        hasta publicarlo (HU-08: CA-08.1; HU-04: CA-04.1; T03).
      security:
        - cognito: [api/projects.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
            example:
              title: Talleres de lectura en Socabaya
              description: Materiales y facilitadores para talleres de lectura infantil.
              goalAmountCents: 450000
      responses:
        "201":
          description: Proyecto creado.
          headers:
            Location:
              description: Ruta del proyecto creado.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    patch:
      tags: [Gestión]
      operationId: updateProject
      summary: Editar título, descripción o meta
      description: |
        Solo GESTOR, en cualquier estado (decisión D2 de tasks.md). La meta nunca puede quedar
        por debajo del monto ya recaudado: la condición se evalúa en la misma escritura.
      security:
        - cognito: [api/projects.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
            example:
              goalAmountCents: 900000
      responses:
        "200":
          description: Proyecto actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Proyectos]
      operationId: getProject
      summary: Consultar el detalle de un proyecto publicado
      description: |
        Un identificador inexistente, mal formado o de un proyecto no publicado devuelve 404
        sin revelar contenido (HU-02: CA-02.1, CA-02.2).
      security: []
      responses:
        "200":
          description: Detalle público del proyecto, sin datos de donantes.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProject"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/projects/{projectId}/stats:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Proyectos]
      operationId: getProjectStats
      summary: Indicadores agregados de un proyecto publicado
      description: |
        Solo cifras agregadas del monto **confirmado simulado**; las donaciones pendientes y
        rechazadas no suman. No expone donantes ni registros individuales (HU-09: CA-09.1,
        CA-09.2).
      security: []
      responses:
        "200":
          description: Indicadores agregados.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStats"
              example:
                projectId: 7a91d0c4-2e5f-4b38-a6c7-1d9e8f2b4a63
                goalAmountCents: 800000
                confirmedAmountCents: 612550
                currency: PEN
                progressPercent: 76
        "404":
          $ref: "#/components/responses/ProjectNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/projects/{projectId}/publish:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    patch:
      tags: [Gestión]
      operationId: publishProject
      summary: Publicar un proyecto en BORRADOR
      description: |
        Solo GESTOR. BORRADOR → PUBLICADO; publicar uno ya publicado devuelve 409 (HU-08:
        CA-08.2). No existe la transición inversa.
      security:
        - cognito: [api/projects.write]
      responses:
        "200":
          description: Proyecto publicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/manage/projects:
    get:
      tags: [Gestión]
      operationId: listManagedProjects
      summary: Listar todos los proyectos, también los BORRADOR
      description: Solo GESTOR. Permite editar y publicar desde la interfaz (HU-08).
      security:
        - cognito: [api/projects.write]
      responses:
        "200":
          description: Todos los proyectos, del más reciente al más antiguo.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/donations:
    post:
      tags: [Donaciones]
      operationId: createDonation
      summary: Registrar una intención de donación simulada
      description: |
        Solo DONANTE. Crea una donación `PENDIENTE_SIMULACION`; **no se realiza ningún cobro**
        ni se piden datos de pago (HU-05: CA-05.1 a CA-05.5). El `donorSub` sale del token.

        **Idempotencia (CA-05.4):** la clave, la donación y el evento de auditoría se escriben
        en una sola transacción. Repetir la misma `Idempotency-Key` con el mismo cuerpo devuelve
        la respuesta original (cabecera `Idempotency-Replayed: true`) sin crear otra donación;
        con otro cuerpo, 409. La clave vale 24 horas y es propia de cada usuario.
      security:
        - cognito: [api/donations.write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDonationRequest"
            example:
              projectId: 7a91d0c4-2e5f-4b38-a6c7-1d9e8f2b4a63
              amountCents: 2500
      responses:
        "201":
          description: Intención registrada (o respuesta repetida de la misma clave).
          headers:
            Location:
              description: Ruta de la donación.
              schema:
                type: string
            Idempotency-Replayed:
              description: Presente con `true` si la respuesta es la de una solicitud anterior.
              schema:
                type: string
                const: "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonorDonation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/donations/{donationId}:
    parameters:
      - $ref: "#/components/parameters/DonationId"
    get:
      tags: [Donaciones]
      operationId: getDonation
      summary: Consultar una donación propia
      description: |
        Solo DONANTE y solo la propia (decisión D1). Una donación ajena responde igual que una
        inexistente, 404, sin revelar que existe (HU-07: CA-07.2; T09).
      security:
        - cognito: [api/donations.read]
      responses:
        "200":
          description: La donación.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonorDonation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DonationNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/donations/{donationId}/simulate:
    parameters:
      - $ref: "#/components/parameters/DonationId"
    post:
      tags: [Donaciones]
      operationId: simulateDonation
      summary: Simular la confirmación o el rechazo de una donación propia
      description: |
        **Solo existe en el stage `academic`** (CA-06.1): en otro stage la plantilla no crea la
        ruta. Solo DONANTE y solo la propia (una ajena responde 404).

        Una transacción cambia la donación únicamente si sigue `PENDIENTE_SIMULACION` y es del
        `sub` del token; si se confirma, suma el monto al proyecto en la misma escritura. Una
        segunda simulación, aunque llegue en paralelo, responde 409 y no vuelve a sumar
        (CA-06.2, T08). Un rechazo no modifica el acumulado (CA-06.3). No hay ningún cobro.
      security:
        - cognito: [api/donations.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateDonationRequest"
            example:
              outcome: CONFIRMADA_SIMULADA
      responses:
        "200":
          description: Donación con su nuevo estado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonorDonation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DonationNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/donations/me:
    get:
      tags: [Donaciones]
      operationId: getMyDonations
      summary: Historial de donaciones del donante autenticado
      description: |
        Solo las donaciones cuyo `donorSub` es el `sub` del access token, de la más reciente a
        la más antigua. No recibe ningún identificador del cliente, así que no puede leer
        historiales ajenos (HU-07: CA-07.1, CA-07.2; HU-04: CA-04.2, CA-04.3). Requiere el
        grupo DONANTE.
      security:
        - cognito: [api/donations.read]
      responses:
        "200":
          description: Historial propio (lista vacía si no hay donaciones).
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationList"
              example:
                items:
                  - donationId: 0d6f8a10-0000-4000-8000-000000000003
                    projectId: 7a91d0c4-2e5f-4b38-a6c7-1d9e8f2b4a63
                    amountCents: 7500
                    currency: PEN
                    status: PENDIENTE_SIMULACION
                    createdAt: "2026-11-11T09:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/audit:
    get:
      tags: [Auditoría]
      operationId: listAuditEvents
      summary: Eventos de auditoría con filtros por tipo y fecha
      description: |
        Solo el grupo AUDITOR (HU-10: CA-10.1). El MFA lo garantiza Cognito: el trigger
        *pre token generation* no emite tokens a un AUDITOR sin TOTP (HU-11, decisión D5).

        Del más reciente al más antiguo. Con `eventType` se pagina con `cursor`; sin él se
        devuelven los `limit` eventos más recientes de todos los tipos, sin paginación.

        Cada evento trae `timestamp`, `requestId`, actor seudonimizado, recurso, acción y
        resultado; nunca tokens, claves, montos ni datos personales (CA-10.2).
      security:
        - cognito: [api/audit.read]
      parameters:
        - name: eventType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AuditEventType"
        - name: from
          in: query
          required: false
          description: Desde esta fecha (`YYYY-MM-DD`) o instante UTC ISO 8601, incluido.
          schema:
            type: string
          example: "2026-11-12"
        - name: to
          in: query
          required: false
          description: Hasta esta fecha (todo el día) o instante UTC ISO 8601, incluido.
          schema:
            type: string
          example: "2026-11-14"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: Valor `nextCursor` de la página anterior (mismo `eventType`).
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: Página de eventos.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
              example:
                items:
                  - eventType: PROJECT_PUBLISH
                    eventId: 6f1c9a2e-0000-4000-8000-000000000001
                    timestamp: "2026-11-12T15:00:00.000Z"
                    requestId: GuUxCg5XiYcEM1g=
                    actorRef: actor_3QmZ0k1x9aPq2LrT7vWbYc
                    actorRole: GESTOR
                    action: projects.publish
                    resourceRef: project/7a91d0c4-2e5f-4b38-a6c7-1d9e8f2b4a63
                    outcome: SUCCESS
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    cognito:
      type: oauth2
      description: |
        Amazon Cognito con Authorization Code + PKCE (cliente público, sin secreto). Reemplazar
        `DOMINIO` por el prefijo de la salida `CognitoDomain` de la pila. El access token dura
        15 minutos.
      flows:
        authorizationCode:
          authorizationUrl: https://DOMINIO.auth.us-east-2.amazoncognito.com/oauth2/authorize
          tokenUrl: https://DOMINIO.auth.us-east-2.amazoncognito.com/oauth2/token
          refreshUrl: https://DOMINIO.auth.us-east-2.amazoncognito.com/oauth2/token
          scopes:
            openid: Identidad OIDC
            email: Correo del usuario
            api/projects.write: Crear y publicar proyectos (GESTOR)
            api/donations.write: Crear y simular donaciones propias (DONANTE)
            api/donations.read: Consultar el historial propio (DONANTE)
            api/audit.read: Consultar eventos de auditoría (AUDITOR)
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generado por el cliente para cada intención; se reutiliza en los reintentos.
      schema:
        type: string
        format: uuid
    DonationId:
      name: donationId
      in: path
      required: true
      description: Identificador UUID de la donación.
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Identificador UUID del proyecto.
      schema:
        type: string
        format: uuid
  headers:
    NoStore:
      description: Las respuestas del API no se almacenan en caché.
      schema:
        type: string
        const: no-store
  responses:
    BadRequest:
      description: |
        Cuerpo ausente, que no es JSON o con campos inválidos o no permitidos. El mensaje nombra
        los campos, pero no repite los valores recibidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: BAD_REQUEST
            message: "Datos inválidos: goalAmountCents"
            requestId: 2eee4fce-bdb1-498b-b467-6c24572eed51
    Conflict:
      description: |
        La operación no es compatible con el estado actual: publicar un proyecto ya publicado o
        fijar una meta menor que el monto recaudado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: CONFLICT
            message: El proyecto ya está publicado
            requestId: 2eee4fce-bdb1-498b-b467-6c24572eed51
    Unauthorized:
      description: |
        Sin token, con un token alterado, caducado o de otro app client. Lo emite el JWT
        authorizer de API Gateway con su formato nativo (CA-03.2, T02, T11). Si el token llega
        a la Lambda pero no es un access token, la Lambda responde 401 con el formato `Error`.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/NativeGatewayError"
              - $ref: "#/components/schemas/Error"
          example:
            message: Unauthorized
    Forbidden:
      description: |
        El token es válido pero no alcanza. Sin el scope de la ruta (también un ID token),
        API Gateway responde con su formato nativo; sin el grupo requerido, la Lambda responde
        con el formato `Error` (CA-04.1, CA-04.2).
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/NativeGatewayError"
              - $ref: "#/components/schemas/Error"
          example:
            code: FORBIDDEN
            message: No tiene permiso para esta operación
            requestId: 2eee4fce-bdb1-498b-b467-6c24572eed51
    DonationNotFound:
      description: La donación no existe, es de otro usuario o el identificador es inválido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: Donación no encontrada
            requestId: 2eee4fce-bdb1-498b-b467-6c24572eed51
    ProjectNotFound:
      description: El proyecto no existe, no está publicado o el identificador es inválido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: Proyecto no encontrado
            requestId: 2eee4fce-bdb1-498b-b467-6c24572eed51
    TooManyRequests:
      description: |
        Límite de throttling del stage de API Gateway superado (design.md §6.2). Lo emite API
        Gateway antes de llegar a Lambda, con su formato nativo.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NativeGatewayError"
          example:
            message: Too Many Requests
    InternalError:
      description: Error inesperado. No incluye detalles internos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INTERNAL
            message: Error interno
            requestId: 2eee4fce-bdb1-498b-b467-6c24572eed51
  schemas:
    Currency:
      type: string
      const: PEN
    AmountCents:
      type: integer
      minimum: 0
      description: Importe en céntimos enteros de PEN.
    ProjectStatus:
      type: string
      enum: [BORRADOR, PUBLICADO]
    PublicProject:
      type: object
      additionalProperties: false
      required:
        [
          projectId,
          title,
          description,
          goalAmountCents,
          confirmedAmountCents,
          currency,
          status,
          updatedAt,
        ]
      properties:
        projectId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          description: Finalidad del proyecto.
        goalAmountCents:
          $ref: "#/components/schemas/AmountCents"
        confirmedAmountCents:
          $ref: "#/components/schemas/AmountCents"
        currency:
          $ref: "#/components/schemas/Currency"
        status:
          $ref: "#/components/schemas/ProjectStatus"
        updatedAt:
          type: string
          format: date-time
          description: Última modificación (creación, edición o publicación; decisión D2).
    CreateProjectRequest:
      type: object
      additionalProperties: false
      description: |
        No admite otros campos: el estado, el monto recaudado, la moneda y el identificador los
        fija el servidor (CA-NF02.2).
      required: [title, description, goalAmountCents]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          minLength: 10
          maxLength: 2000
        goalAmountCents:
          type: integer
          minimum: 1
          maximum: 100000000
          description: Meta en céntimos enteros de PEN (máximo S/ 1 000 000).
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Campos editables según la decisión D2. `goalAmountCents` nunca puede quedar por debajo
        de `confirmedAmountCents` (409).
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          minLength: 10
          maxLength: 2000
        goalAmountCents:
          type: integer
          minimum: 1
          maximum: 100000000
    ProjectList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicProject"
    ProjectStats:
      type: object
      additionalProperties: false
      required:
        [
          projectId,
          goalAmountCents,
          confirmedAmountCents,
          currency,
          progressPercent,
        ]
      properties:
        projectId:
          type: string
          format: uuid
        goalAmountCents:
          $ref: "#/components/schemas/AmountCents"
        confirmedAmountCents:
          $ref: "#/components/schemas/AmountCents"
        currency:
          $ref: "#/components/schemas/Currency"
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
    CreateDonationRequest:
      type: object
      additionalProperties: false
      description: |
        No admite otros campos: ni `donorSub` (sale del token) ni datos de pago (CA-05.3, CA-05.5).
      required: [projectId, amountCents]
      properties:
        projectId:
          type: string
          format: uuid
        amountCents:
          type: integer
          minimum: 100
          maximum: 100000
          description: De S/ 1.00 a S/ 1 000.00, en céntimos enteros (CA-05.1).
    SimulateDonationRequest:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [CONFIRMADA_SIMULADA, RECHAZADA_SIMULADA]
    DonationStatus:
      type: string
      enum: [PENDIENTE_SIMULACION, CONFIRMADA_SIMULADA, RECHAZADA_SIMULADA]
    DonorDonation:
      type: object
      additionalProperties: false
      required:
        [donationId, projectId, amountCents, currency, status, createdAt]
      properties:
        donationId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        amountCents:
          $ref: "#/components/schemas/AmountCents"
        currency:
          $ref: "#/components/schemas/Currency"
        status:
          $ref: "#/components/schemas/DonationStatus"
        createdAt:
          type: string
          format: date-time
    DonationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DonorDonation"
    AuditEventType:
      type: string
      enum:
        [
          PROJECT_CREATE,
          PROJECT_UPDATE,
          PROJECT_PUBLISH,
          DONATION_CREATE,
          DONATION_SIMULATE,
        ]
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        [
          eventType,
          eventId,
          timestamp,
          requestId,
          actorRef,
          actorRole,
          action,
          resourceRef,
          outcome,
        ]
      properties:
        eventType:
          $ref: "#/components/schemas/AuditEventType"
        eventId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          description: Correlación con los logs de Lambda y de API Gateway.
        actorRef:
          type: string
          description: Seudónimo HMAC del `sub`; no revela la identidad de Cognito.
        actorRole:
          type: [string, "null"]
          description: Grupo con el que actuó.
        action:
          type: string
        resourceRef:
          type: string
          description: Por ejemplo `project/<id>` o `donation/<id>`; `-` si el ID era inválido.
        outcome:
          type: string
          enum: [SUCCESS, DENIED, REJECTED]
        changedFields:
          type: array
          description: Solo en ediciones; nombres de los campos, nunca sus valores.
          items:
            type: string
    AuditEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        nextCursor:
          type: string
          description: Presente si hay más eventos del mismo `eventType`.
    NativeGatewayError:
      type: object
      description: Formato de los errores que API Gateway emite sin invocar a Lambda.
      required: [message]
      properties:
        message:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum:
            [
              BAD_REQUEST,
              UNAUTHORIZED,
              FORBIDDEN,
              NOT_FOUND,
              CONFLICT,
              INTERNAL,
            ]
        message:
          type: string
        requestId:
          type: string
          description: Identificador de la solicitud para correlacionar con los logs (CA-NF07.1).
