# Revisión semanal de dependencias vulnerables o desactualizadas (design.md §6.2).
# Dependabot debe activarse además en Settings → Code security del repositorio.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      lint-y-formato:
        patterns:
          ["eslint", "@eslint/*", "typescript-eslint", "prettier", "globals"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      lint-y-formato:
        patterns:
          [
            "eslint",
            "@eslint/*",
            "eslint-plugin-*",
            "typescript-eslint",
            "prettier",
            "globals",
          ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
